name: Package to zip
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-legacy-migration.txt

      - name: Validate source before build
        run: |
          python scripts/validate_site.py
          python -m unittest discover -s tests -v

      - name: Use production config
        run: |
          test -f _config_prod.yml || { echo "::error ::_config_prod.yml not found"; exit 1; }
          cp _config_prod.yml _config.yml
          echo "Using _config_prod.yml as _config.yml for this build"

      - name: Build with Jekyll (Pages deps)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
        env:
          JEKYLL_ENV: production

      - name: Validate generated site before packaging
        run: python scripts/validate_site.py --site _site

      - name: Zip site
        run: |
          cd _site
          zip -rq ../site.zip .
          cd ..

      - name: Create/Update single 'prod' release and upload site.zip
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: prod
          name: Production Build
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: site.zip
