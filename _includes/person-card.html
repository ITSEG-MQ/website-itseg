<article class="card person-card">
  <a class="card-media" href="{{ include.item.url | relative_url | escape }}" tabindex="-1" aria-hidden="true">
    <img src="{{ include.item.image | relative_url | escape }}" alt="Portrait of {{ include.item.title | escape }}" width="480" height="560" loading="lazy">
  </a>
  <div class="card-body">
    <h3><a href="{{ include.item.url | relative_url | escape }}">{{ include.item.title | escape }}</a></h3>
    <p class="role">{{ include.item.role | escape }}</p>
    {% if include.item.affiliation and include.item.affiliation != empty %}
      <p>{{ include.item.affiliation | escape }}</p>
    {% endif %}
  </div>
</article>
