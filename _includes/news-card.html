<article class="card news-card">
  <a class="card-media" href="{{ include.item.url | relative_url | escape }}" tabindex="-1" aria-hidden="true">
    {% if include.item.cover == '/assets/pic/brand/logo-large.png' %}
      <img class="news-card-logo" src="{{ '/assets/ui/itseg-logo.webp' | relative_url }}" alt="ITSEG logo" width="296" height="320" loading="lazy">
    {% else %}
      <img src="{{ include.item.cover | relative_url | escape }}" alt="News image for {{ include.item.title | escape }}" width="640" height="360" loading="lazy">
    {% endif %}
  </a>
  <div class="card-body">
    <p class="eyebrow"><time datetime="{{ include.item.date | date_to_xmlschema | escape }}">{{ include.item.date | date: '%-d %B %Y' | escape }}</time></p>
    <h3><a href="{{ include.item.url | relative_url | escape }}">{{ include.item.title | escape }}</a></h3>
    <p>{{ include.item.content | strip_html | normalize_whitespace | truncatewords: 28 | escape }}</p>
  </div>
</article>
