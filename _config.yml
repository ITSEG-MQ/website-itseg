
title: "ITSEG — Intelligent Systems Engineering Group"
short_title: "ITSEG"
description: "Macquarie University's Intelligent Systems Engineering Group researches trustworthy intelligent systems, cyber-physical systems, autonomous systems, and software engineering."
url: "https://itseg-mq.github.io"
baseurl: "/website-itseg"
environment: "staging"
lang: "en-AU"
timezone: "Australia/Sydney"

contact:
  email: "james.zheng@mq.edu.au"
  phone: "+61 2 9850 6330"
  phone_href: "+61298506330"
  office: "Sydney Office"
  organisation: "School of Computing, Macquarie University"
  room: "Room 361, Level 3"
  street: "4 Research Park Drive"
  locality: "Macquarie University, NSW, Australia"

collections:
  news:
    output: true
