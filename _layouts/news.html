---
layout: default
---
<article class="detail-page">
  <header class="page-intro container narrow">
    <p class="eyebrow"><a href="{{ '/news/' | relative_url | escape }}">News</a> · <time datetime="{{ page.date | date_to_xmlschema | escape }}">{{ page.date | date: '%-d %B %Y' | escape }}</time></p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="container narrow prose">
    {{ content }}
  </div>
  <nav class="container narrow back-link" aria-label="News return"><a href="{{ '/news/' | relative_url | escape }}">← All news</a></nav>
</article>
