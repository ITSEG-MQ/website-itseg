---
layout: default
---
<article class="detail-page">
  <header class="page-intro container narrow">
    <p class="eyebrow"><a href="{{ '/projects/' | relative_url | escape }}">Projects</a> · {% if page.category == 'grants' %}National competitive grant{% else %}Other project{% endif %}</p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="container narrow">
    <img class="project-image" src="{{ page.image | relative_url | escape }}" alt="Project image for {{ page.title | escape }}" width="800" height="500" loading="lazy">
  </div>
  <div class="container narrow prose">
    {{ content }}
  </div>
  <nav class="container narrow back-link" aria-label="Projects return"><a href="{{ '/projects/' | relative_url | escape }}">← All projects</a></nav>
</article>
